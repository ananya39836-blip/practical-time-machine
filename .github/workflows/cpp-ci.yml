name: Practical Time Machine C++14 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Pure .cpp Engine & Unit Test Suite
        working-directory: cpp
        run: |
          mkdir -p bin
          g++ -std=c++14 -O3 -Wall -Wextra -Isrc src/main.cpp -o bin/ptm_engine
          g++ -std=c++14 -O3 -Wall -Wextra -Isrc src/tests.cpp -o bin/ptm_tests

      - name: Execute All 9 C++ Unit Tests (including 2-Virtual-Class OOP Polymorphism)
        working-directory: cpp
        run: ./bin/ptm_tests

      - name: Execute Full Level-10 C++ Verification Suite (--all)
        working-directory: cpp
        run: ./bin/ptm_engine --all
